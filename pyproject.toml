[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = ["baselines/vendor", "runs", "data", "checkpoints"]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# Apply formatting and syntax checks without rewriting model implementations.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
